<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ورود — مدیریت موجودی انبارهای کارگاه</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 20px; }
  .login-card { max-width: 380px; width: 100%; }
  .login-card .logo { text-align: center; font-size: 32px; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="card login-card">
    <div class="logo">📦</div>
    <div class="card-title" style="justify-content:center">مدیریت موجودی انبارهای کارگاه</div>
    <div class="card-sub" style="text-align:center">برای ورود، یوزرنیم و پسوردتان را وارد کنید</div>

    <label class="field-label">یوزرنیم</label>
    <input id="username" autocomplete="username" placeholder="یوزرنیم">

    <label class="field-label">پسورد</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="پسورد">

    <button class="btn btn-primary" id="loginBtn">ورود</button>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  (function () {
    const session = getSession();
    if (session && session.token) {
      window.location.href = session.role === "admin" ? "admin.html" : `workshop.html?wh=${encodeURIComponent(warehouseOf(session))}`;
    }
  })();

  async function doLogin() {
    const btn = document.getElementById("loginBtn");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if (!username || !password) return toast("یوزرنیم و پسورد را وارد کنید", "err");
    setLoading(btn, true, "در حال ورود...");
    try {
      const data = await api("login", { username, password });
      setSession(data);
      toast("ورود موفق بود.", "ok");
      window.location.href = data.role === "admin" ? "admin.html" : `workshop.html?wh=${encodeURIComponent(warehouseOf(data))}`;
    } catch (err) {
      toast(err.message, "err");
      setLoading(btn, false);
    }
  }

  document.getElementById("loginBtn").addEventListener("click", doLogin);
  document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
